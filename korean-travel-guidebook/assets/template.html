<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title>
<style>
@@FONT@@
:root{color-scheme:light;--ink:#282c28;--muted:#535b51;--paper:#f4f0e7;--line:#d3ccbc;--accent:#405c4c}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.8 'Nanum Gothic',sans-serif}main,header,footer{max-width:980px;margin:auto;padding:24px}h1{font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.35;margin:.3em 0}h2{font-size:1.5rem;line-height:1.5}h3{font-size:1.15rem}a{color:#284e68;text-underline-offset:3px}p,li,td,th,summary,a{overflow-wrap:anywhere}a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #87591c;outline-offset:3px}.skip{position:absolute;left:8px;top:-100px;background:white;padding:10px}.skip:focus{top:8px}.card{background:#fff;padding:24px;margin:0 0 24px;border:1px solid var(--line);border-radius:5px}.brief{border-left:4px solid var(--accent)}.tip,.warning{padding:14px 18px;background:#edf2e9;border-left:4px solid #607257}.warning{background:#faf0df;border-color:#9b732c}.muted{color:var(--muted)}.tag{font-size:.9em;font-weight:bold}nav{display:flex;flex-wrap:wrap;gap:6px 16px;margin:18px 0}nav a,button{min-height:44px;display:inline-flex;align-items:center}button{font:inherit;cursor:pointer;color:var(--ink);background:#faf8f2;border:1px solid #a8ac9f;border-radius:3px;padding:6px 12px;white-space:normal}table{width:100%;border-collapse:collapse;margin:16px 0;table-layout:fixed;font-size:.95em}th{background:#405c4c;color:white;text-align:left}td{background:white}th,td{padding:10px;border:1px solid var(--line);vertical-align:top}caption{text-align:left;font-weight:bold;margin:6px 0}details{margin:14px 0;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;min-height:44px;font-weight:bold}ul{padding-left:1.4em}figure{margin:20px 0}img{display:block;max-width:100%;height:auto}figure>a{display:block}figcaption{font-size:.9em;color:var(--muted)}.copy-value{display:block;max-width:100%;width:100%;font:inherit;border:1px solid var(--line);padding:8px;background:#fff;color:var(--ink)}.copy-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.status{min-height:1.8em}.small{font-size:.9em}dialog{max-width:94vw;max-height:94vh;border:1px solid #777;background:white;padding:16px}dialog::backdrop{background:#000a}dialog img{max-height:75vh;width:auto;margin:auto}.credits{font-size:.85em}.print-only{display:none}@media(max-width:600px){main,header,footer{padding:16px}.card{padding:17px}table,tbody,tr,td,th{font-size:1em}table.responsive thead{display:none}table.responsive tr{display:block;border:1px solid var(--line);margin:12px 0}table.responsive td{display:block;border:0;border-bottom:1px solid #eee}table.responsive td::before{content:attr(data-label) '：';font-weight:bold;color:var(--accent)}h2{font-size:1.35rem}}@media print{@page{margin:16mm}body{font-size:11pt;background:white}header,main,footer{padding:0;max-width:none}.card{border:0;border-bottom:1px solid #aaa;padding:0 0 12pt;margin-bottom:14pt;break-inside:auto}h2,h3,summary{break-after:avoid}tr,figure,.tip,.warning{break-inside:avoid}th{background:#ddd!important;color:#000!important}details{display:block}details>summary{display:block}details>*{display:block!important}nav,.no-print,dialog,.sources{display:none!important}.print-only{display:block}a{color:inherit;text-decoration:none}.credits{display:block!important}table{table-layout:fixed;font-size:10pt}img{max-height:180mm}input{border:0!important}}
</style></head><body><a class="skip" href="#content">본문으로 건너뛰기</a><header>@@HEADER@@</header><main id="content">@@CONTENT@@</main><footer>@@FOOTER@@</footer>
<dialog id="image-dialog" aria-labelledby="zoom-title"><h2 id="zoom-title">이미지 확대</h2><button id="zoom-close" type="button">닫기</button><img id="zoom-image" alt="확대한 이미지"><p id="zoom-caption"></p></dialog>
<script>
(function(){'use strict';let opener=null;const dialog=document.getElementById('image-dialog');document.querySelectorAll('[data-copy]').forEach(function(button){button.addEventListener('click',async function(){const input=document.getElementById(button.dataset.copy),status=document.getElementById(button.dataset.copy+'-status');try{if(!navigator.clipboard)throw new Error('unavailable');await navigator.clipboard.writeText(input.value);status.textContent='복사했습니다.'}catch(e){input.focus();input.select();status.textContent='자동 복사를 사용할 수 없습니다. 선택한 이름을 길게 누르거나 Ctrl/Cmd+C로 복사하세요.'}})});document.querySelectorAll('[data-zoom]').forEach(function(button){button.addEventListener('click',function(){const image=document.getElementById(button.dataset.zoom);if(!dialog.showModal){window.location.href=image.src;return}opener=button;document.getElementById('zoom-image').src=image.src;document.getElementById('zoom-image').alt=image.alt;document.getElementById('zoom-caption').textContent=image.dataset.caption||image.alt;dialog.showModal();document.getElementById('zoom-close').focus()})});document.getElementById('zoom-close').addEventListener('click',function(){dialog.close()});dialog.addEventListener('close',function(){if(opener)opener.focus()});window.addEventListener('beforeprint',function(){document.querySelectorAll('details').forEach(function(d){d.dataset.wasOpen=d.open?'yes':'no';d.open=true})});window.addEventListener('afterprint',function(){document.querySelectorAll('details').forEach(function(d){d.open=d.dataset.wasOpen==='yes'})})})();
</script></body></html>

name: HelloLintXcode
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  HelloLintXcode:
    type: tool
    platform: macOS
    sources:
      - Sources
    postCompileScripts:
      - name: SwiftLint
        path: Scripts/lint.sh
        shell: /bin/sh
        showEnvVars: false
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Scripts/lint.sh
          - $(SRCROOT)/.swiftlint.yml
          - $(SRCROOT)/Sources
          - $(SRCROOT)/.tools
    scheme: {}

name: ReviewMoment
options:
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
settings:
  GENERATE_INFOPLIST_FILE: YES
  PRODUCT_BUNDLE_IDENTIFIER: dev.oozoofrog.review-moment.$(TARGET_NAME:rfc1034identifier)
  MARKETING_VERSION: 1.0
  CURRENT_PROJECT_VERSION: 1
  SWIFT_VERSION: 5.0
targets:
  Clips:
    type: application
    platform: [macOS, iOS]
    sources: [App]
  ClipsTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Clips_macOS
    settings:
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/Clips.app/Contents/MacOS/Clips
      BUNDLE_LOADER: $(TEST_HOST)
schemes:
  ClipsMac:
    build:
      targets:
        Clips_macOS: all
    test:
      targets: [ClipsTests]

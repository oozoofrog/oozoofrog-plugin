interface:
  display_name: 협업 실행
  short_description: 프로젝트 분석과 최소 질문으로 요구를 정리하고 검증 루프를 실행합니다
  default_prompt: $guided-execution 현재 프로젝트와 요구사항을 분석하고 꼭 필요한 질문만 정리한 뒤, 작업 루프 환경을 만들고 검증하면서 완료까지 진행해주세요.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  allow_implicit_invocation: true

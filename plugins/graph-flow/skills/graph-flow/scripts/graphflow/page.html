<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Graph flow</title>
<style nonce="__NONCE__">

:root{color-scheme:light;--night:#f5f6f8;--ink:#202630;--panel:#fff;--soft:#f1f3f5;--line:#c9cfd7;--cream:#202630;--muted:#606b7a;--paper:#fff;--mint:#27745c;--violet:#355dc5;--amber:#875608;--coral:#ac4931}
*{box-sizing:border-box}
body{margin:0;background:var(--panel);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,textarea,select{font:inherit}
button,select,textarea,input{border:1px solid var(--line);border-radius:8px}
button,select{min-height:40px;min-width:40px;padding:8px 14px;background:var(--paper);color:var(--ink);cursor:pointer}
button:hover,select:hover{background:var(--soft);border-color:#8792a2}
button:active{background:#e8ecf1}
button:disabled{opacity:.5;cursor:default}
button.primary,button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:white}
button.amber{background:#895809;border-color:#895809;color:white}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
h1,h2,h3{line-height:1.4;letter-spacing:-.025em;overflow-wrap:anywhere}
h1{font-size:26px;font-weight:700;margin:2px 0 4px}h2{font-size:22px;margin:0 0 16px}h3{font-size:17px;margin:0 0 10px}
p{margin:8px 0}small,.muted{color:var(--muted);font-size:13px}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:.02em}
header{padding:20px 28px 16px;display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:16px 28px;align-items:center;border-bottom:1px solid #e3e6eb}
#where{margin:0;font-size:12px;font-weight:500}#where:before{content:"◇";margin-right:8px;color:var(--violet)}#subtitle{margin:0;font-size:13px}
nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;font-size:13px}
nav>button{border-color:transparent;font-weight:600}nav>button[aria-pressed=true]{background:#edf1fa;border-color:transparent;color:#244ca9}
#picker-label,#find label{display:flex;align-items:center;gap:8px}#find label>span,#picker-label>span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#find-text{width:172px;min-height:40px;padding:8px 12px;background:var(--night);color:var(--ink)}#picker{max-width:240px;background:var(--night)}
.ref-line{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;grid-column:1/-1;margin:0;color:var(--muted);font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.ref{font:500 13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;padding:1px 5px;border:1px solid #d9dee6;background:#f4f6f8;color:#495464;border-radius:4px}button.ref{min-height:28px;min-width:28px;margin:0}button.ref:hover{color:var(--violet)}
main{padding:16px 24px 16px;min-width:0}
#notice{margin:0 0 16px;padding:16px 20px;background:#f0f3f8;border:1px solid var(--line);border-radius:10px}#notice button{margin-left:16px}
#home{max-width:1040px;margin:12px auto}#home>section{margin:0 0 32px}#home>details{margin:0 0 12px;border-top:1px solid #e3e6eb}
button.small{min-height:36px;padding:5px 11px;font-size:13px}button.link{min-height:0;min-width:0;padding:0;border:0;background:transparent;color:inherit;text-decoration:underline;text-underline-offset:3px;text-align:left;font-weight:600}
.now{list-style:none;padding:0;margin:0}.now li,.log>li{padding:14px 16px;border:1px solid #e3e6eb;border-left:3px solid var(--line);background:var(--panel);border-radius:8px;margin:8px 0;overflow-wrap:anywhere}.now li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;border-left-color:var(--violet)}.now .walker{position:relative;right:auto;top:auto;width:28px;height:28px;flex:none}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 16px;font-size:13px}
.log{list-style:none;padding:0;margin:0}.log>li.passed{border-left-color:var(--mint)}.log>li.returned{border-left-color:var(--coral);background:#fffaf7}.log>li.mine{border-left-color:var(--amber)}.log>li.running{border-left-color:var(--violet)}.log>li.found{outline:2px solid var(--violet);outline-offset:3px}
.row-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}.row-time,.row-who{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}.row-text{flex:1 1 340px;min-width:0}.row-text>*,.tasks td>*{margin-right:6px}.log details summary{min-height:36px;padding:8px 0 0;font-size:13px;color:var(--muted)}.log .eyebrow{margin:16px 0 4px}.log ul{margin:6px 0}
.checks{list-style:none;padding:0}.checks li{margin:12px 0;font-size:14px}.checks p{margin:4px 0}.checks code{font:12px/1.6 ui-monospace,monospace}.check-failed strong{color:var(--coral)}.checks pre{background:#f1f3f6;padding:14px;border-radius:6px;margin:10px 0}
.table-wrap{overflow-x:auto}table.tasks{width:100%;min-width:560px;border-collapse:collapse}.tasks th,.tasks td{text-align:left;padding:12px;border-bottom:1px solid #e3e6eb;vertical-align:top;font-size:14px}.tasks th{color:var(--muted);font-size:12px;font-weight:500}
#flow{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
#attention{display:flex;align-items:stretch;gap:12px;grid-column:1/-1;padding:14px 16px;background:#fffbf2;border:1px solid #e6d3a7;border-radius:10px}
.attention-heading{flex:0 0 116px;align-self:center;color:#79500c;font-size:13px;font-weight:600}.attention-heading strong{display:block;font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums}
.attention-items{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;flex:1;min-width:0}.attention-item{display:flex;align-items:center;gap:12px;border-left:1px solid #e6d3a7;padding-left:16px;min-width:0}.attention-item>div{flex:1;min-width:0}.attention-item p{margin:0;font-size:14px;font-weight:600;overflow-wrap:anywhere}.attention-item .ref-line{font-weight:400;font-size:13px;margin-bottom:3px}.attention-item>button{flex:none;white-space:nowrap;border-color:#d6bc89;color:#79500c;background:white;font-size:13px}
#map{position:relative;min-width:0;min-height:460px;height:calc(100dvh - 188px);border:1px solid #dce1e8;border-radius:12px;overflow:hidden;background:var(--night);display:flex;flex-direction:column}
#flow:has(#attention:not([hidden])) #map{height:calc(100dvh - 278px)}
.map-toolbar{display:flex;gap:6px;align-items:center;padding:10px 16px;flex:none;background:#ffffffed;border-bottom:1px solid #e0e4eb;z-index:5;flex-wrap:wrap}.map-toolbar button{min-height:32px;min-width:32px;padding:3px 9px;font-size:13px}.map-toolbar output{font-size:12px;color:var(--muted);min-width:42px;text-align:center}.map-help{color:var(--muted);font-size:12px;margin-left:8px}.map-title{margin-right:auto;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center}.map-title span{font-weight:400;color:var(--muted)}
.map-viewport{position:relative;flex:1;min-height:0;overflow:auto;cursor:grab;overscroll-behavior:contain;scrollbar-color:#b8c1ce transparent;background-image:radial-gradient(#d5dce5 .7px,transparent .7px);background-size:20px 20px}
.map-viewport.panning{cursor:grabbing;user-select:none}.map-spacer{position:relative}.map-stage{position:absolute;left:0;top:0;transform-origin:0 0}
.node-position{position:absolute;width:248px;z-index:2;transition:left .24s ease,top .24s ease}
.node-card{position:relative;width:248px;border:1px solid #c7cfd9;border-radius:10px;background:white;color:var(--ink);box-shadow:0 2px 4px #24324a08;overflow:hidden}
.node-card.passed{border-color:#c4d4cc}.node-card.current{border-color:#9eb5e3;border-top:3px solid var(--violet)}.node-card.waiting_for_you{border-color:#caa159;border-top:3px solid #a16b15}.node-card.unused{border-style:dashed;background:#fcfcfd}
.node-card.expanded{outline:2px solid var(--violet);outline-offset:4px;box-shadow:0 4px 18px #355dc518}
.node-header{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px;width:100%;padding:14px 16px;border:0;border-radius:0;background:transparent;color:inherit;text-align:left;position:relative;align-content:start;cursor:pointer}
.node-header:hover{background:#f6f8fc}.node-header:focus-visible{outline-offset:-4px}.type-icon{width:20px;height:20px;flex:none;color:#677486}
.node-title{font-size:17px;line-height:1.5;font-weight:650;overflow-wrap:anywhere;white-space:normal}.node-header>.type-icon{margin-top:3px}
.node-status{grid-column:1/-1;display:flex;align-items:center;gap:7px;font-size:13px;line-height:1.6;font-weight:500}.node-status:before{content:"";width:8px;height:8px;border:1.5px solid #778293;border-radius:50%;flex:none}.passed .node-status{color:#27644f}.passed .node-status:before{content:"✓";border:0;width:12px;height:auto;font-weight:700}.current .node-status{color:#3158af}.current .node-status:before{border:2px solid #b5c6e9;border-top-color:#355dc5}.waiting_for_you .node-status{color:#805410;font-weight:600}.waiting_for_you .node-status:before{border-radius:2px;background:#a16b15;border:0}
.attempt-caption{grid-column:1/-1;font-size:13px;line-height:1.5;color:var(--muted)}.node-reference{border-top:1px solid #edf0f4;padding:8px 16px;gap:6px 8px}.node-reference .attempt-caption{margin-left:auto}.node-reference .node-worker{flex:1 1 100%}.node-worker{display:block;font-size:13px;overflow-wrap:anywhere}
.card-note{margin:0;padding:12px 16px;border-top:1px solid #e4e8ee;font-size:13px;line-height:1.65;overflow-wrap:anywhere}.card-note.returned{background:#fcf1ec;color:#98422d}.card-note.returned span{display:block;margin-top:4px}.card-note.returned:before{content:"↩ ";font-weight:700}.card-note.mine{background:#fffbf2;color:#68480f}.card-note p{margin:0 0 10px}.card-note.mine button{width:100%;text-align:left;background:white;border-color:#ddc99d;color:#79500c;font-weight:600}
.edge-layer{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:0}.edge-path{fill:none;stroke-width:1.5;stroke:#7a8697}.edge-path.closed{stroke-dasharray:5 5}.edge-path.open{stroke:#739285}.edge-path.returned{stroke:#b97159}.edge-path.waiting_for_you{stroke:#b38b40;stroke-width:2}.edge-path.review{stroke-dasharray:2 5;stroke-linecap:round}
marker .open{fill:#739285}marker .closed{fill:#7a8697}marker .returned{fill:#b97159}marker .waiting_for_you{fill:#b38b40}
.edge-chip{position:absolute;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:4px 6px;border:1px solid #e0e5eb;border-radius:5px;background:var(--night);color:#566274;font-size:13px;line-height:19px;text-align:center;overflow-wrap:anywhere;z-index:3}
.edge-chip.returned{color:#98422d}.edge-chip.waiting_for_you{color:#805410}
.map-complete span{color:var(--mint);font-weight:600}
#flow.has-selection{grid-template-columns:minmax(0,1fr) 400px}
#panel{position:relative;align-self:stretch;min-width:0;background:white;border:1px solid #dce1e8;border-radius:12px;overflow:auto;padding:24px;overscroll-behavior:contain;max-height:calc(100dvh - 188px)}
#flow:has(#attention:not([hidden])) #panel{max-height:calc(100dvh - 292px)}#panel h2{padding-right:28px;margin-bottom:8px;font-size:22px}#panel .eyebrow{margin-top:24px}#panel>.muted{margin:16px 0}.panel-close{position:absolute;right:12px;top:12px;border:0;font-size:20px;line-height:1;padding:8px}.panel-close:hover{background:var(--soft)}
aside .log>li{padding:12px;background:#fafbfc}aside .row-text{flex-basis:100%}aside .card{padding:14px;margin-bottom:12px}aside .card p{margin:6px 0;font-size:14px}aside .card .eyebrow{margin-top:0}
.card{padding:20px;border:1px solid #dde2e9;border-radius:10px;background:var(--panel);margin:0 0 16px}.card.failed{background:#fff4ef;border-color:#ebc7b8;color:#903a27}.card.failed .eyebrow{color:#903a27}.paper{background:#fffcf6}.card button{margin:10px 6px 0 0}.card p{overflow-wrap:anywhere}
ul{padding-left:22px}#accessible{margin:16px 0 0;max-width:1100px;font-size:13px;color:var(--muted)}summary{cursor:pointer;min-height:44px;padding:10px 0}#node-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;padding:14px 0;list-style:none}#node-list li{margin:0}#edge-list li{margin:8px 0}
#decision{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,.8fr);gap:32px;padding:16px 0;max-width:1120px;margin:auto}#decision>div{min-width:0}#decision .reading{padding:24px;min-height:0;background:#fffcf6;border-color:#e4d9c3;align-self:start}
#decision h2{outline:none;font-size:26px}#decision .worker-report{display:flex;align-items:center;gap:12px;margin:18px 0}#decision .worker-report img{width:40px;height:40px;object-fit:contain;flex:none}.speech{padding:12px 16px;background:#f0f3f8;border-radius:8px;font-size:14px;overflow-wrap:anywhere}
#decision .reading .card{padding:14px 0;margin-bottom:12px;background:transparent;border:0;border-bottom:1px solid #e5dfd3;border-radius:0}#decision .reading .card p{margin:4px 0;font-size:14px}#decision .reading textarea{min-height:112px;padding:12px}#decision .reading>p{margin:8px 0}
textarea{width:100%;resize:vertical;min-height:112px;background:white;color:var(--ink);padding:14px;line-height:1.7}label{display:block}#answer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}#answer-message{color:#795100;font-size:13px}
pre{word-break:normal;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 ui-monospace,monospace;max-height:350px;overflow:auto}.evidence{margin-top:24px}.file-choices{display:flex;gap:12px;flex-wrap:wrap}.file-choices>div{min-width:0;max-width:100%}.file-path{display:block;overflow-wrap:anywhere;margin:8px 0;color:var(--muted)}.file-reader{background:white;color:var(--ink);border:1px solid #d6dce5;border-radius:8px;padding:20px;max-height:480px;max-width:100%;font:14px/1.8 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4}
.empty{padding:25px 0}.skip{position:absolute;left:12px;top:-80px;background:white;color:var(--ink);padding:10px;z-index:10}.skip:focus{top:12px}[hidden]{display:none!important}
@media(max-width:1100px){header{grid-template-columns:1fr}nav{justify-content:flex-start}#map{height:calc(100dvh - 240px)}#flow:has(#attention:not([hidden])) #map{height:calc(100dvh - 348px)}.map-help{display:none}}
@media(max-width:760px){header{padding:16px;gap:14px}h1{font-size:23px}nav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}nav>button{flex:1;font-size:14px}#find{flex:1;min-width:0}#find-text{width:100%}#picker-label{flex:1;min-width:0}#picker{width:100%;max-width:none;font-size:12px}main{padding:14px 12px 24px}#subtitle{font-size:12px}#attention{display:block;padding:12px}.attention-heading{display:flex;gap:8px;align-items:center;margin-bottom:10px}.attention-heading strong{font-size:17px}.attention-items{display:flex;flex-direction:column;gap:10px}.attention-item{padding:0 0 0 10px;border-left:2px solid #d8b775;gap:8px}.attention-item p{font-size:13px}.attention-item .ref-line{font-size:12px}.attention-item>button{padding:6px 10px;min-height:40px}#map,#flow:has(#attention:not([hidden])) #map{height:530px;min-height:420px}.map-toolbar{padding:8px}.map-title span{display:none}#panel,#flow:has(#attention:not([hidden])) #panel{position:relative;top:auto;right:auto;bottom:auto;width:100%;max-height:none;padding:20px;box-shadow:none}#flow,#flow.has-selection{grid-template-columns:1fr;gap:12px}#decision{grid-template-columns:1fr;padding:8px 0;gap:12px}#decision .reading{padding:18px}.file-reader{padding:12px;font-size:13px}#home{margin:4px auto}.row-head{gap:6px}.row-time{flex-basis:100%;font-size:12px}.log>li{padding:12px}.map-viewport{touch-action:pan-x pan-y}}
@keyframes step{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes arrive{from{opacity:.45;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.walker{position:absolute;right:12px;top:-27px;width:28px;height:28px;z-index:4;pointer-events:none}
.walker img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;animation:step .7s linear infinite}.walker img+img{opacity:0;animation-delay:-.35s}
.node-card.working .node-status:before{animation:turn 1.6s linear infinite}.node-card.changed{animation:arrive .3s ease-out}.edge-path.flowing{stroke-dasharray:6 4;animation:flow 2s linear infinite}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
<script type="module" nonce="__NONCE__" src="/static/page.js"></script>
</head>
<body>
<a class="skip" href="#content" data-i18n="skip"></a>
<header><div><p class="eyebrow" id="where"></p><h1 id="title">Graph flow</h1><p id="subtitle" class="muted" aria-live="polite"></p></div><nav aria-label="Views"><button id="flow-tab" data-i18n="graph" aria-pressed="true"></button><button id="home-tab" data-i18n="home" aria-pressed="false"></button><form id="find" role="search"><label><span data-i18n="find"></span><input id="find-text" type="search" autocomplete="off" spellcheck="false"></label></form><label id="picker-label" hidden><span data-i18n="chooseRun"></span><select id="picker"></select></label></nav></header>
<main id="content"><section id="notice" role="status" hidden></section><div id="home" hidden></div><section id="flow"><section id="attention" hidden aria-label="Your turn"></section><div id="map" role="region" aria-label="Flow map"></div><aside id="panel" hidden></aside></section><section id="decision" hidden aria-labelledby="decision-title"></section><details id="accessible"><summary data-i18n="listView"></summary><h2 data-i18n="nodes"></h2><ul id="node-list"></ul><h2 data-i18n="handoffs"></h2><ul id="edge-list"></ul><h2 data-i18n="yourTurn"></h2><ul id="decision-list"></ul></details></main>
</body></html>

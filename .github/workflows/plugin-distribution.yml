name: Plugin distribution

on:
  pull_request:
    paths:
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - 'plugins/**'
      - 'scripts/**'
      - '**/SKILL.md'
      - '**/agents/openai.yaml'
      - '**/*.md'
      - '.github/workflows/plugin-distribution.yml'
  push:
    branches: [main]
    paths:
      - '.agents/plugins/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - 'plugins/**'
      - 'scripts/**'
      - '**/SKILL.md'
      - '**/agents/openai.yaml'
      - '**/*.md'
      - '.github/workflows/plugin-distribution.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - name: Distribution and documentation checks
        run: python -I -S -B -m unittest discover -s scripts/tests -v
      - name: Whitespace checks
        run: git diff --check

  fstack-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exercise the PR watcher and statechart
        shell: bash
        run: |
          set -euo pipefail
          export FSTACK_CACHE_DIR="$RUNNER_TEMP/fstack-cache"
          npm install --prefix "$RUNNER_TEMP/fstack-tools" --no-audit --no-fund bun@1.3.9 node@22.18.0
          export PATH="$RUNNER_TEMP/fstack-tools/node_modules/.bin:$PATH"
          bun test plugins/fstack/skills/run-engineering-workflow/scripts/watch-pr
          cp -R plugins/fstack/skills/verify-state-transitions "$RUNNER_TEMP/statechart"
          cd "$RUNNER_TEMP/statechart/scripts"
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          node --test test/*.test.ts

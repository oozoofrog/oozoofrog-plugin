name: Team harness

on:
  pull_request:
    paths:
      - 'team-coordination/**'
      - 'plugins/team-coordination/**'
      - 'tools/codex-team-harness/**'
      - 'scripts/tests/test_team_harness_distribution.py'
      - 'scripts/tests/test_plugin_distribution.py'
      - '.github/workflows/team-harness.yml'
  push:
    branches: [main]
    paths:
      - 'team-coordination/**'
      - 'plugins/team-coordination/**'
      - 'tools/codex-team-harness/**'
      - 'scripts/tests/test_team_harness_distribution.py'
      - 'scripts/tests/test_plugin_distribution.py'
      - '.github/workflows/team-harness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - name: Harness regression
        working-directory: tools/codex-team-harness
        run: python -I -S -B -m unittest discover -s tests -v
      - name: Portable distribution
        run: python -I -S -B -m unittest discover -s scripts/tests -p test_team_harness_distribution.py -v
      - name: Plugin distribution
        run: python -I -S -B -m unittest discover -s scripts/tests -p test_plugin_distribution.py -v
      - name: Manifest and archive reproducibility
        run: |
          python -I -S -B tools/codex-team-harness/make_release.py
          git diff --exit-code -- tools/codex-team-harness/manifest.json
          git diff --check

      - name: Repository sync and distribution regressions
        run: python -I -S -B -m unittest discover -s scripts/tests -v
      - name: Swift settings regressions (mock Xcode boundary)
        run: python -I -S -B -m unittest discover -s plugins/swift-intelligence/tests -v
      - name: Browser bridge and diagram regressions (Node VM)
        run: |
          node --test macpilot/browser/tests/*.test.cjs
          node --test c4fy/tests/*.test.mjs
